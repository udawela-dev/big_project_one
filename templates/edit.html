<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit {{ food.name }} — FreshTrack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #2b3a42;
      min-height: 100vh;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e3e8ec;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(20, 40, 60, 0.06);
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 { font-size: 22px; font-weight: 800; color: #1d4e3f; }
    h1 .track { color: #2e8b66; font-weight: 700; }

    .back-link {
      color: #2e8b66;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }

    .error {
      background: #fdecea;
      border: 1px solid #f5b5ac;
      border-left: 4px solid #d64541;
      border-radius: 8px;
      padding: 12px 16px;
      color: #a33a34;
      font-size: 15px;
      margin-bottom: 16px;
    }

    .add-form h2 {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #5d6d75;
      margin-bottom: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }

    .field label {
      font-size: 12px;
      font-weight: 600;
      color: #5d6d75;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input,
    .field select {
      padding: 9px 11px;
      border: 1px solid #cdd6db;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: #2b3a42;
      width: 100%;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: #2e8b66;
      box-shadow: 0 0 0 3px rgba(46, 139, 102, 0.15);
    }

    .form-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }

    .submit-btn {
      background: #2e8b66;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover { background: #277457; }

    .cancel-btn {
      background: #eef2f4;
      color: #41616e;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .cancel-btn:hover { background: #dfe7ea; }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div>
        <h1>Edit <span class="track">{{ food.name }}</span></h1>
        <a class="back-link" href="/">&larr; Back to your food</a>
      </div>
    </header>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <section class="card add-form">
      <h2>Update this item</h2>
      <form action="/edit/{{ food_id }}" method="post">
        <div class="field">
          <label for="name">Food name</label>
          <input type="text" id="name" name="name" value="{{ food.name }}" required>
        </div>
        <div class="field">
          <label for="expiry_date">Expiry date</label>
          <input type="date" id="expiry_date" name="expiry_date" value="{{ food.expiry_date }}" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            {% for category in categories %}
              <option value="{{ category }}" {% if category == food.category %}selected{% endif %}>{{ category }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="submit-btn">Save changes</button>
          <a class="cancel-btn" href="/">Cancel</a>
        </div>
      </form>
    </section>

  </div>
</body>
</html>
